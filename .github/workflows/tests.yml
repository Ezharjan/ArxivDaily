name: Tests

# Runs the test suite when the code changes. Editing config.json doesn't
# trigger this; the ArxivDaily workflow checks your configuration instead.
on:
  push:
    paths:
      - main.py
      - "src/**"
      - "tests/**"
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - main.py
      - "src/**"
      - "tests/**"
      - .github/workflows/tests.yml

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
